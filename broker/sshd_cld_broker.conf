# Dedicated cld test-broker sshd instance -- a single-purpose sshd, separate
# from the system one. Run it as:
#
#     /usr/sbin/sshd -f /etc/cld/sshd_cld_broker.conf -D
#
# Bind only to the docker bridge gateway so only containers on the bridge can
# reach it -- never the LAN. 172.17.0.1 is the default docker0 gateway; adjust
# to your bridge (`docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}'`).
ListenAddress 172.17.0.1
Port 2222

HostKey /etc/cld/broker_ssh_host_ed25519_key

# Key-only; this instance authenticates one dedicated user with one key.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers CLD_BROKER_USER
AuthorizedKeysFile /etc/cld/broker_authorized_keys

# The session can only ever be the forced command: no shell, no forwarding.
ForceCommand /opt/cld/cld-broker.sh
PermitTTY no
AllowTcpForwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
GatewayPorts no
X11Forwarding no
PermitTunnel no
