base_image = "claude-base:latest"
devcontainer_image = "claude-devcontainer:latest"
run_image = "claude-run:latest"

# SSL CA certificates: internal (Seznam) CAs are baked into the base image
# trust store and consumed via SSL_CERT_FILE / REQUESTS_CA_BUNDLE /
# NODE_EXTRA_CA_CERTS. Set ssl_certs_path only as an opt-in escape hatch to
# *replace* the baked bundle with a host-supplied dir or PEM file. There is
# no auto-detect / auto-mount anymore.
# ssl_certs_path = "/etc/ssl/certs"

# Agent-wait tunables (used by chain orchestrator)
agent_timeout = 1800   # seconds to wait for an agent before declaring timeout
poll_interval = 30     # seconds between docker-ps polls

# Chain orchestration tunables
# chain_max_parallel = 4    # max agents running in parallel in a chain
# chain_default_model = ""  # model override for chain agents; empty = use agent default

# Diagnostics
debug = false

# Logging
# log_level = "INFO"          # DEBUG / INFO / WARNING / ERROR
# log_color = "auto"          # auto / always / never

# RO $HOME paths staged into every container (relative to $HOME).
# Extend or narrow this list to match your actual tooling.
home_mounts_always = [
    ".claude.json",
    ".config/claude"
]

# Additional RO $HOME paths staged only for interactive devcontainer sessions.
# Remove entries for tools you don't use (e.g. drop nvim lines if you use vim/emacs).
home_mounts_devcontainer = [
    ".gitconfig",
    ".bashrc"
]

# Host paths registered as launchable targets from inside `cld master`.
# Each path is materialized as an empty placeholder directory in master's shell
# (no bind mount, no repo content); `cd <path> && cld agent` launches a peer
# container with -v <path>:/workspace/origin:rw. Master itself never sees or
# writes to the target repo.
# master_targets = ["~/repos/foo", "~/work/bar"]

# SSH agent forwarding into devcontainer sessions.
# Omit this key to auto-detect from the host's $SSH_AUTH_SOCK.
# Set to "" to disable forwarding. Set to an explicit socket path to override.
# ssh_auth_sock = ""

# Inter-container agent messaging (mailboxes + repo agent supervisor)
# mailbox_root = "~/.cld/mailboxes"  # host root for the mailbox tree
# agent_max_turns = 30               # per-message turn cap for the agent supervisor
# agent_kickoff_persona = "agent"  # persona used to kick off a new agent session
